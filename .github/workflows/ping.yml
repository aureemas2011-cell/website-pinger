name: Scheduled Website Ping

on:
  schedule:
    # This syntax means: "Every 5 minutes"
    - cron: '*/5 * * * *'
  workflow_dispatch: # This allows you to run it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Open Website
        run: curl -I -s https://travels.aureemas.com/
